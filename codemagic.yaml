workflows:
  halaqati-android:
    name: بناء تطبيق حلقاتي - أندرويد
    max_build_duration: 60
    environment:
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: تثبيت الحزم
        script: npm install

      - name: تنزيل كل المكتبات والخط محلياً لضمان عمل التطبيق دون إنترنت بالكامل
        script: |
          mkdir -p www/vendor/fonts
          curl -sL https://cdn.tailwindcss.com -o www/vendor/tailwind.js
          curl -sL https://unpkg.com/react@18.2.0/umd/react.production.min.js -o www/vendor/react.production.min.js
          curl -sL https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js -o www/vendor/react-dom.production.min.js
          curl -sL https://unpkg.com/@babel/standalone@7.23.0/babel.min.js -o www/vendor/babel.min.js
          curl -sL https://unpkg.com/lucide@0.292.0 -o www/vendor/lucide.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js -o www/vendor/html2canvas.min.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/vendor/jspdf.umd.min.js
          python3 << 'PYEOF'
          import re, urllib.request, os

          css_url = "https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
          req = urllib.request.Request(css_url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          })
          css = urllib.request.urlopen(req).read().decode('utf-8')

          os.makedirs('www/vendor/fonts', exist_ok=True)
          blocks = re.findall(r"@font-face\s*{[^}]*}", css)
          local_css = ""
          for i, block in enumerate(blocks):
              weight_m = re.search(r"font-weight:\s*(\d+)", block)
              weight = weight_m.group(1) if weight_m else str(400 + i)
              url_m = re.search(r"url\((https://fonts\.gstatic\.com/[^)]+)\)", block)
              if not url_m:
                  continue
              font_url = url_m.group(1)
              fname = f"tajawal-{weight}.woff2"
              urllib.request.urlretrieve(font_url, f"www/vendor/fonts/{fname}")
              local_css += (
                  "@font-face {\n"
                  "  font-family: 'Tajawal';\n"
                  "  font-style: normal;\n"
                  f"  font-weight: {weight};\n"
                  "  font-display: swap;\n"
                  f"  src: url('fonts/{fname}') format('woff2');\n"
                  "}\n"
              )
          with open('www/vendor/tajawal.css', 'w') as f:
              f.write(local_css)
          print("Downloaded", len(blocks), "font weights")
          PYEOF

      - name: التحقق من نجاح تنزيل كل الملفات (يوقف البناء فوراً إذا نقص أي ملف)
        script: |
          echo "===== محتويات مجلد vendor ====="
          ls -la www/vendor
          echo "===== محتويات مجلد vendor/fonts ====="
          ls -la www/vendor/fonts
          for f in tailwind.js react.production.min.js react-dom.production.min.js babel.min.js lucide.js html2canvas.min.js jspdf.umd.min.js tajawal.css; do
            path="www/vendor/$f"
            if [ ! -s "$path" ]; then
              echo "❌ فشل تنزيل الملف: $path (مفقود أو فارغ) - إيقاف البناء"
              exit 1
            else
              size=$(stat -c%s "$path" 2>/dev/null || stat -f%z "$path")
              echo "✅ $f - $size بايت"
            fi
          done
          font_count=$(ls www/vendor/fonts/*.woff2 2>/dev/null | wc -l)
          if [ "$font_count" -lt 1 ]; then
            echo "❌ لم يتم تنزيل أي ملف خط (woff2) - إيقاف البناء"
            exit 1
          fi
          echo "✅ تم تنزيل $font_count ملف خط بنجاح"
          echo "===== كل الملفات جاهزة، المتابعة للبناء ====="

      - name: إضافة منصة أندرويد (أول مرة فقط)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: توليد أيقونة التطبيق وشاشة البداية من صورة الغلاف
        script: |
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android
          else
            echo "لم يتم العثور على assets/icon.png - سيتم استخدام الأيقونة الافتراضية"
          fi

      - name: مزامنة ملفات الويب مع مشروع أندرويد
        script: npx cap sync android

      - name: بناء ملف APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
